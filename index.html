<style>
:root{
  --ink:#fff6ea; --ink-dim:#e9d5bf;
  --sky-top:#e59a6a; --sky-mid:#f3b98a; --sky-low:#f7d7a8;
  --hill:#c98d6c; --hill2:#b07a5e; --grass:#6f9a5a;
  --soil:#3b2a22; --soil-2:#2f211b; --soil-line:rgba(255,230,200,.06);
  --bar:#241914; --water:#5fc6ff; --water-deep:#2f8fe0; --leaf:#7cc26a;
  --body:#1c2b3d;
  --font:"Bloom Round",ui-rounded,"Segoe UI",system-ui,sans-serif;
  --font-display:"Bloom Story",Georgia,serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--body:#1c2b3d}}
:root[data-theme="dark"]{--body:#1c2b3d}
html,body{height:100%}
body{background:var(--body);color:var(--ink);font-family:var(--font);overflow:hidden;
  -webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
#app{position:relative;height:100%;max-width:460px;margin:0 auto;display:flex;flex-direction:column;
  background:var(--soil);overflow:hidden;box-shadow:0 0 60px rgba(0,0,0,.4)}
/* ---------- sky ---------- */
#sky{position:relative;flex:0 0 27%;min-height:170px;
  background:linear-gradient(180deg,var(--sky-top) 0%,var(--sky-mid) 55%,var(--sky-low) 100%);overflow:hidden}
#sky .sun{position:absolute;left:50%;bottom:8%;width:120px;height:120px;margin-left:-60px;border-radius:50%;
  background:radial-gradient(circle,#fff1cf 0%,#ffd99a 45%,rgba(255,210,150,0) 72%)}
#sky .cloud{position:absolute;height:14px;border-radius:20px;background:rgba(255,236,214,.55)}
#sky svg.hills{position:absolute;left:0;bottom:0;width:100%;height:55%}
#hud{position:absolute;inset:0 0 auto 0;display:flex;justify-content:space-between;align-items:center;
  padding:10px 14px;z-index:3}
#hud h1{margin:0;font-size:22px;font-weight:800;letter-spacing:.04em;text-shadow:0 2px 0 rgba(120,60,30,.35)}
.pill{display:flex;align-items:center;gap:8px}
.lvl{background:rgba(60,30,20,.45);border-radius:20px;padding:2px 14px;font-weight:700;font-size:16px;
  font-variant-numeric:tabular-nums}
.icon-btn{background:none;border:0;color:var(--ink);padding:4px;cursor:pointer;display:grid;place-items:center}
.icon-btn:focus-visible,.bar button:focus-visible,.cta:focus-visible{outline:3px solid #fff;outline-offset:2px;border-radius:10px}
#treeWrap{position:absolute;left:50%;bottom:6px;width:52%;max-width:220px;transform:translateX(-50%);z-index:2}
#treeWrap > svg{display:block;width:100%;height:auto;overflow:visible}
/* ---------- ground strip ---------- */
#ground{flex:0 0 14px;background:linear-gradient(180deg,#7aa565 0,#5c8a4c 40%,#4a3326 41%,#3b2a22 100%)}
/* ---------- board ---------- */
#boardArea{position:relative;flex:1;min-height:0;display:flex;align-items:center;justify-content:center;
  background:radial-gradient(ellipse at 50% 20%,#45322a 0%,var(--soil) 55%,var(--soil-2) 100%)}
#stones{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
#board{position:relative;display:grid;grid-template-columns:repeat(var(--w),var(--cell));
  grid-template-rows:repeat(var(--h),var(--cell));
  background-image:linear-gradient(var(--soil-line) 1px,transparent 1px),linear-gradient(90deg,var(--soil-line) 1px,transparent 1px);
  background-size:var(--cell) var(--cell);border:1px solid var(--soil-line)}
.tile{position:relative;width:var(--cell);height:var(--cell)}
.tile.pipe{cursor:pointer}
.tile .rot{position:absolute;inset:0;transition:transform .2s cubic-bezier(.3,1.4,.5,1)}
.tile svg{width:100%;height:100%;display:block;overflow:visible}
.tile.pipe:active .rot{filter:brightness(1.15)}
.tile .body{transition:stroke .35s}
.tile .water{opacity:0;transition:opacity .35s}
.tile.wet .water{opacity:1}
.tile.wet .body{stroke:#8fd3f7}
.tile.wet .glow{opacity:1}
.tile .glow{opacity:0;transition:opacity .35s}
.tile.hint .rot{animation:hint .9s ease 2}
@keyframes hint{50%{filter:drop-shadow(0 0 10px #fff6a0) brightness(1.3)}}
.tile.src .drop{animation:bob 2.2s ease-in-out infinite;transform-origin:50% 60%;transform-box:view-box}
@keyframes bob{50%{transform:translateY(-3px) scale(1.04)}}
.tile.pulse .rot{animation:pulse .5s ease}
@keyframes pulse{50%{filter:brightness(1.6) drop-shadow(0 0 8px var(--water))}}
.rootcore{stroke-dasharray:120;stroke-dashoffset:120;transition:stroke-dashoffset .5s ease}
.tile.flow .rootcore{stroke-dashoffset:0}
/* The status row is outside the playing area, so it never covers a pipe. */
.board-status{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px;
  min-height:34px;padding:0 14px 6px;background:#34271f}
.moves{font:700 12px/20px var(--font);color:#dbc6a8;font-variant-numeric:tabular-nums;white-space:nowrap}
.goal-pill{display:flex;align-items:center;gap:6px;padding:3px 10px;border:1px solid rgba(196,222,199,.15);
  border-radius:14px;background:#455044;box-shadow:inset 0 1px 0 rgba(255,255,255,.07)}
.goal-pill svg{flex:none;width:13px;height:16px}
.goal{font:800 12px/18px var(--font);color:#eef0d4;white-space:nowrap}
/* Small glazed garden tools, equally spaced in three identical columns. */
.bar{flex:0 0 auto;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;
  background:linear-gradient(180deg,#3a2c23,#2c211c);padding:9px 12px calc(13px + env(safe-area-inset-bottom,0px));
  border-top:1px solid #5a4634;box-shadow:inset 0 1px 0 rgba(255,239,207,.035)}
.bar button{--tool-top:#f8e4aa;--tool-bottom:#e8c67f;--tool-edge:#a3804d;--tool-ink:#654d2d;
  appearance:none;position:relative;min-width:0;width:100%;height:74px;padding:6px 3px;
  display:grid;grid-template-rows:28px 16px 10px;gap:2px;justify-items:center;align-content:center;
  border:1px solid #ffecc9;border-color:rgba(255,246,222,.62);border-radius:17px;
  background:linear-gradient(160deg,var(--tool-top),var(--tool-bottom));color:var(--tool-ink);
  box-shadow:inset 0 2px 0 rgba(255,255,255,.37),inset 0 -2px 0 rgba(121,87,44,.09),0 3px 0 var(--tool-edge),0 6px 8px rgba(12,10,7,.17);
  font:800 13px/16px var(--font);letter-spacing:0;cursor:pointer;touch-action:manipulation;
  transition:transform .14s ease,box-shadow .14s ease,filter .14s ease}
#bUndo{--tool-top:#deebcf;--tool-bottom:#b9cda9;--tool-edge:#798d66;--tool-ink:#40563c}
#bReset{--tool-top:#f4dcca;--tool-bottom:#dfbba6;--tool-edge:#9f7b65;--tool-ink:#6b4b39}
.tool-icon{display:block;width:28px;height:28px;filter:drop-shadow(0 1px 0 rgba(255,255,255,.55))}
.tool-icon svg{display:block;width:100%;height:100%;overflow:visible}
.tool-label{white-space:nowrap}
.bar small{font:700 10px/10px var(--font);color:inherit;opacity:.8;letter-spacing:0}
@media(hover:hover){.bar button:hover:not(:disabled){filter:brightness(1.045);transform:translateY(-1px)}}
.bar button:active:not(:disabled){transform:translateY(3px);box-shadow:inset 0 1px 3px rgba(83,62,37,.12),0 0 0 var(--tool-edge),0 2px 4px rgba(12,10,7,.12)}
.bar button:disabled{opacity:.53;filter:saturate(.45);cursor:default}
.bar button:focus-visible{outline:3px solid #fff4cd;outline-offset:5px;border-radius:17px}
@media(max-width:359px){.bar{gap:8px;padding-left:10px;padding-right:10px}.bar button{font-size:11.5px}.board-status{padding-left:12px;padding-right:12px}}
/* ---------- win overlay ---------- */
#win{position:absolute;inset:0;z-index:20;pointer-events:none;overflow:hidden}
#win.on{pointer-events:auto}
#win .shade{position:absolute;inset:0;opacity:0;transition:opacity .7s;
  background:radial-gradient(circle at 50% 42%,rgba(255,230,160,.55) 0%,rgba(40,70,50,.75) 45%,rgba(10,20,20,.92) 100%)}
#win.on .shade{opacity:1}
#win .rays{position:absolute;left:50%;top:40%;width:780px;height:780px;margin:-390px 0 0 -390px;opacity:0;
  background:repeating-conic-gradient(rgba(255,244,200,.22) 0 8deg,rgba(255,244,200,0) 8deg 22deg);
  -webkit-mask:radial-gradient(circle,#000 10%,transparent 62%);mask:radial-gradient(circle,#000 10%,transparent 62%);
  transition:opacity 1s .5s}
#win.on .rays{opacity:1;animation:spin 24s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#win .fly{position:absolute;transform-origin:0 0}
#win .fly > svg{width:100%;height:auto;display:block;overflow:visible}
#win .msg{position:absolute;left:0;right:0;bottom:9%;text-align:center;opacity:0;transform:translateY(20px);
  transition:opacity .5s,transform .5s cubic-bezier(.3,1.5,.5,1)}
#win.show .msg{opacity:1;transform:none}
#win .msg h2{margin:0 16px;font-size:36px;text-wrap:balance;font-weight:800;line-height:1;color:#fff;text-shadow:0 3px 0 #2e6b3a,0 0 24px rgba(160,255,160,.5)}
#win .msg p{margin:6px 0 14px;color:#e6f4df;font-size:16px}
.stars{display:flex;justify-content:center;gap:8px;margin:10px 0 4px}
.stars span{font-size:38px;line-height:1;color:rgba(255,255,255,.2);transform:scale(0);transition:transform .45s cubic-bezier(.3,1.8,.5,1)}
.stars span.on{color:#ffd54a;text-shadow:0 0 14px rgba(255,210,80,.8)}
#win.show .stars span{transform:scale(1)}
#win.show .stars span:nth-child(2){transition-delay:.15s}
#win.show .stars span:nth-child(3){transition-delay:.3s}
.cta{pointer-events:auto;font:800 20px var(--font);color:#1f3d1c;background:linear-gradient(#b8f08e,#6fc257);
  border:0;border-radius:40px;padding:10px 38px;box-shadow:0 5px 0 #3f7d33,0 10px 24px rgba(0,0,0,.35);cursor:pointer}
.cta:active{transform:translateY(3px);box-shadow:0 2px 0 #3f7d33}
.fall{position:absolute;top:-20px;width:14px;height:9px;border-radius:0 100% 0 100%;background:var(--leaf);
  animation:fall linear forwards}
@keyframes fall{to{transform:translate(var(--dx),110vh) rotate(var(--r))}}
.spark{position:absolute;width:6px;height:6px;border-radius:50%;background:#fff6c0;box-shadow:0 0 10px #fff2a0;
  animation:spark 1s ease-out forwards}
@keyframes spark{to{transform:translate(var(--dx),var(--dy)) scale(0);opacity:0}}
/* tree bloom states (shared by both copies) */
.tree .br{stroke:#5b4a40;transition:stroke 1.2s}
.tree .vein{stroke:var(--water);stroke-dasharray:300;stroke-dashoffset:300;opacity:.95;filter:drop-shadow(0 0 3px #9be0ff)}
.tree .lf{transform:scale(0);transform-box:fill-box;transform-origin:center;transition:transform .5s cubic-bezier(.3,1.7,.5,1)}
.tree.bloom .br{stroke:#6e4a2e}
.tree.bloom .vein{animation:vein 1s ease forwards}
@keyframes vein{to{stroke-dashoffset:0}}
.tree.bloom .lf{transform:scale(1);transition-delay:var(--d)}
.tree .tip{fill:#9be08a;opacity:.0}
.tree.hint-green .tip{opacity:1}
/* settings */
[hidden]{display:none!important}
#menu{position:absolute;right:10px;top:48px;z-index:30;background:#2b1f19;border-radius:14px;padding:10px;
  box-shadow:0 10px 30px rgba(0,0,0,.5);display:flex;flex-direction:column;gap:4px;min-width:180px}
#menu button{background:none;border:0;color:var(--ink);font:600 15px var(--font);text-align:left;padding:6px 10px;border-radius:8px;cursor:pointer}
#menu button:hover{background:rgba(255,255,255,.07)}
@media (prefers-reduced-motion: reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}

/* Cozy tree art: proportional at every viewport, with a gentle bloom. */
#treeWrap{bottom:1px;width:auto;max-width:76%;height:calc(100% - 49px);aspect-ratio:240/216}
#treeWrap > svg{width:100%;height:100%}
.tree.cozy-tree .lf{opacity:0;transform:scale(.12);transform-box:fill-box;transform-origin:50% 70%;transition:transform .72s cubic-bezier(.2,1.32,.35,1),opacity .45s ease}
.tree.cozy-tree.bloom .lf{opacity:1;transform:scale(1);transition-delay:var(--d)}
.cozy-tree .resting-buds{transition:opacity .6s}
.cozy-tree.bloom .resting-buds{opacity:0}
.cozy-tree .meadow-bloom{opacity:.45;transition:opacity 1s 1s}
.cozy-tree.bloom .meadow-bloom{opacity:1}
.cozy-tree .vein{stroke:#bbdfcf;filter:none;opacity:0}
.cozy-tree.bloom .vein{animation:cozy-water 1.7s ease forwards}
@keyframes cozy-water{0%{opacity:0;stroke-dashoffset:300}25%{opacity:.85}75%{opacity:.65;stroke-dashoffset:0}100%{opacity:0;stroke-dashoffset:0}}
.cozy-tree.bloom .tree-crown{transform-origin:120px 185px;animation:cozy-sway 6s ease-in-out 2s infinite}
@keyframes cozy-sway{0%,100%{transform:rotate(-.65deg)}50%{transform:rotate(.65deg)}}
#win .fly{filter:drop-shadow(0 7px 15px rgba(38,49,30,.12))}
@media(prefers-reduced-motion:reduce){.cozy-tree *{animation:none!important;transition:none!important}.cozy-tree.bloom .vein{stroke-dashoffset:0}}

/* Dormant wood fades into the original restored tree when water arrives. */
.cozy-tree .dry-tree{opacity:1;transition:opacity 1.15s ease}
.cozy-tree .living-art{opacity:0;transition:opacity 1.2s ease}
.cozy-tree.bloom .dry-tree{opacity:0}
.cozy-tree.bloom .living-art{opacity:1}
.tile.root .water{transition:opacity .7s ease}

/* Glazed waterway, gentle fill feedback and direction-aware bubbles. */
.tile .rot{transition:transform .24s cubic-bezier(.22,1.28,.4,1)}
.aqua-pipe{transition:transform .18s ease}
.tile.pipe:active .aqua-pipe{transform:scale(.97)}
.tile .aqua-pipe .water{transition:opacity .48s ease}
.tile.wet .aqua-pipe .glow{opacity:.12!important}
.pipe-currents .stream-bubbles{animation:water-bubbles 2.8s linear infinite;animation-delay:var(--stream-delay,0s);animation-play-state:paused}
.pipe-currents .stream-sparkles{animation:water-sparkles 4.2s linear infinite;animation-play-state:paused;opacity:.65}
.tile.wet .pipe-currents path{animation-play-state:running}
@keyframes water-bubbles{to{stroke-dashoffset:-56}}
@keyframes water-sparkles{to{stroke-dashoffset:-80}}
.tile.wet .aqua-pipe .pipe-cuff{animation:cuff-fill .5s ease-out}
@keyframes cuff-fill{0%{filter:brightness(1)}40%{filter:brightness(1.18)}100%{filter:brightness(1)}}
.aqua-source .spring-glint{transform-origin:77px 31px;animation:spring-glint 3.6s ease-in-out infinite}
@keyframes spring-glint{0%,100%{opacity:.45;transform:scale(.8)}50%{opacity:.95;transform:scale(1.05)}}
@media(prefers-reduced-motion:reduce){.pipe-currents path,.spring-glint,.pipe-cuff{animation:none!important}.tile .rot,.aqua-pipe{transition:none!important}}

#board{background-image:none;border-color:transparent}
.tile::before{content:"";position:absolute;inset:3%;border-radius:12%;background:rgba(255,237,214,.025);pointer-events:none}

/* Fine-grained soil and a continuous ground-to-root connection. */
#boardArea{background:#3a2c22}
#stones{overflow:hidden}
.tile::before{background:rgba(255,237,214,.012)}
#treeWrap{max-width:none}
#ground{position:relative;background:linear-gradient(180deg,#879969 0%,#71865b 23%,#5f754b 36%,#745236 39%,#513a29 70%,#4b372a 100%)}
#ground::after{content:"";position:absolute;left:50%;top:3px;bottom:0;width:var(--root-neck-width,22px);transform:translateX(-50%);background:linear-gradient(90deg,#4c392d,#9a7956 17%,#b4976d 37%,#8a684a 65%,#4f3b2f)}
#ground::before{content:"";position:absolute;left:50%;top:3px;bottom:0;width:3px;transform:translateX(-50%);background:#6cdae0;opacity:0;z-index:1;transition:opacity .45s .1s}
#app:has(#board .top-root.flow) #stones .root-bridge .rootcore{stroke-dashoffset:0;transition-delay:.12s}
#app:has(#board .top-root.flow) #ground::before{opacity:1}
/* Warm, calm scenery behind the hero tree. */
#sky{isolation:isolate;background:linear-gradient(180deg,#e8b497 0%,#f5d3b3 55%,#f7e7c3 100%)}
.sky-scene{position:absolute;inset:0;overflow:hidden;z-index:0;pointer-events:none}
.sky-scene svg{display:block;width:100%;height:auto}
.sky-haze{position:absolute;inset:0;background:radial-gradient(ellipse at 76% 45%,rgba(255,245,207,.35),rgba(255,239,202,0) 64%)}
.cozy-sun{position:absolute;left:75%;bottom:30%;width:clamp(96px,26%,132px);aspect-ratio:1;transform:translateX(-50%);z-index:0}
.sun-halo{animation:sun-breathe 8s ease-in-out infinite;transform-origin:60px 60px}
.sun-rays{animation:sun-turn 120s linear infinite;transform-origin:60px 60px}
@keyframes sun-breathe{0%,100%{opacity:.75;transform:scale(.95)}50%{opacity:1;transform:scale(1.03)}}
@keyframes sun-turn{to{transform:rotate(360deg)}}
.sky-cloud{position:absolute;left:-160px;z-index:1;opacity:var(--cloud-opacity,.75);will-change:transform;transform:translateX(var(--cloud-rest));animation:cloud-pass var(--cloud-speed,100s) linear infinite;animation-delay:var(--cloud-delay,0s)}
@keyframes cloud-pass{from{transform:translateX(0)}to{transform:translateX(var(--cloud-travel,780px))}}
.sky-scene .sky-landscape{position:absolute;left:0;bottom:0;width:100%;height:61%;z-index:2}
.bird-flight{position:absolute;left:-110px;top:26%;width:100px;height:48px;z-index:3;opacity:0;animation:birds-pass 52s linear -6s infinite;pointer-events:none}
@keyframes birds-pass{0%{opacity:0;transform:translate(0,10px)}4%{opacity:.6}29%{opacity:.6}33%,100%{opacity:0;transform:translate(var(--bird-travel,660px),-8px)}}
.bird-wings{transform-box:fill-box;transform-origin:50% 100%;animation:bird-flap .85s ease-in-out infinite;animation-delay:var(--wing-delay,0s)}
@keyframes bird-flap{0%,100%{transform:scaleY(1)}50%{transform:scaleY(.38)}}
#hud{padding:10px 13px;gap:8px}
#hud h1{font:700 clamp(20px,5.8vw,25px)/1.1 var(--font-display);letter-spacing:-.045em;
  color:#604b36;text-shadow:0 1px 0 rgba(255,245,218,.7);white-space:nowrap}
.pill{gap:5px;flex-shrink:0}
.lvl{padding:4px 10px;font:800 12px/20px var(--font);color:#5a5039;
  background:rgba(255,246,217,.65);border:1px solid rgba(255,252,229,.6);box-shadow:0 2px 0 rgba(123,89,57,.12)}
.icon-btn{color:#6d563f;border-radius:50%;background:rgba(255,244,219,.38);padding:5px}
.icon-btn svg{width:23px;height:23px}
#win .msg h2{font-family:var(--font-display);font-weight:700;letter-spacing:-.025em;line-height:1.12}
.cta{font-family:var(--font-display);font-weight:700}
.bloom-butterflies{opacity:0;pointer-events:none;transition:opacity .9s ease 1.2s}
.tree.bloom .bloom-butterflies{opacity:1}
.butterfly-flight{transform-box:fill-box;transform-origin:center;animation:butterfly-drift var(--butterfly-speed,5s) ease-in-out infinite;animation-delay:var(--butterfly-delay,0s);animation-play-state:paused}
.butterfly-wings{transform-box:view-box;transform-origin:12px 12px;animation:butterfly-flutter var(--flutter-speed,.4s) ease-in-out infinite;animation-play-state:paused}
.tree.bloom .butterfly-flight,.tree.bloom .butterfly-wings{animation-play-state:running}
@keyframes butterfly-drift{0%,100%{transform:translate(0,0) rotate(-9deg)}25%{transform:translate(5px,-4px) rotate(4deg)}50%{transform:translate(9px,0) rotate(13deg)}75%{transform:translate(3px,5px) rotate(-2deg)}}
@keyframes butterfly-flutter{0%,100%{transform:scaleX(1)}50%{transform:scaleX(.28)}}
.scene-paused .sky-cloud,.scene-paused .bird-flight,.scene-paused .bird-wings,.scene-paused .sun-halo,.scene-paused .sun-rays,.scene-paused .butterfly-flight,.scene-paused .butterfly-wings{animation-play-state:paused!important}
@media(prefers-reduced-motion:reduce){
  .sky-cloud,.bird-flight,.bird-wings,.sun-halo,.sun-rays,.butterfly-flight,.butterfly-wings{animation:none!important}
  .sky-cloud{transform:translateX(var(--cloud-rest))}
  .bird-flight{display:none}
  .bloom-butterflies{transition:none!important}
}

</style>
</head>
<body>

<div id="app">
  <div id="sky">
    <div id="skyScenery" class="sky-scene" aria-hidden="true"></div>
    <div id="hud">
      <h1>Root &amp; Bloom</h1>
      <div class="pill">
        <div class="lvl" id="lvl">Seviye 1</div>
        <button class="icon-btn" id="gear" aria-label="Ayarlar">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="currentColor"><path d="M19.4 13a7.5 7.5 0 0 0 0-2l2.1-1.6-2-3.5-2.5 1a7 7 0 0 0-1.7-1L15 3.3h-4l-.4 2.6a7 7 0 0 0-1.7 1l-2.5-1-2 3.5L6.6 11a7.5 7.5 0 0 0 0 2l-2.1 1.6 2 3.5 2.5-1a7 7 0 0 0 1.7 1l.4 2.6h4l.4-2.6a7 7 0 0 0 1.7-1l2.5 1 2-3.5zM13 15.5a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7z" transform="translate(-1 0)"/></svg>
        </button>
      </div>
    </div>
    <div id="treeWrap"></div>
  </div>
  <div id="ground"></div>
  <div id="boardArea">
    <svg id="stones" aria-hidden="true" focusable="false"></svg>
    <div id="board"></div>
  </div>
  <div class="board-status" aria-label="Seviye bilgisi">
    <div class="moves" id="moves">Hamle: 0</div>
    <div class="goal-pill">
      <svg viewBox="0 0 16 20" aria-hidden="true"><path d="M8 1C6 5 1.5 9 1.5 12.7a6.5 6.5 0 0 0 13 0C14.5 9 10 5 8 1Z" fill="#a5ded4" stroke="#ceeae0" stroke-width=".8"/><path d="M4 12c0 2 1 3 2.5 3.5" fill="none" stroke="#f4fff1" stroke-width="1.4" stroke-linecap="round"/></svg>
      <span class="goal" id="goal"></span>
    </div>
  </div>
  <div class="bar" role="group" aria-label="Oyun araçları">
    <button id="bHint" type="button">
      <span class="tool-icon" aria-hidden="true"><svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M10.5 19.5C6.4 16 7.1 8 12.6 6.1c8.6-3.1 13.5 7.8 7 13.4L19 23h-8Z" fill="#fff1bd"/><path d="M11 23h8v2a3 3 0 0 1-3 3h-2a3 3 0 0 1-3-3Z" fill="#ba9151"/><path d="M15.1 22v-8m0 3c-3 .2-4.3-1.6-4.3-4 2.7-.1 4.3 1.2 4.3 4Zm.1-2c.1-3.1 1.8-4.5 4.6-4.5-.1 2.7-1.6 4.3-4.6 4.5Z" fill="#adc17b" stroke="#6e814e" stroke-width="1.3"/><path d="M16 2v1M4 8l1.5 1M27 8l-1.5 1M3 17h2M27 17h2" stroke="#ad8952"/><path d="M11.5 9.5l1-.8" stroke="#fffdf0" stroke-width="2.3"/></svg></span>
      <span class="tool-label">İpucu</span><small id="hintLeft">3 hak</small>
    </button>
    <button id="bUndo" type="button">
      <span class="tool-icon" aria-hidden="true"><svg viewBox="0 0 32 32" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M8 10.5h9a9 9 0 0 1 0 18" stroke="#7e9365" stroke-width="4.7" transform="translate(0 -3)"/><path d="M8 10.5h9a9 9 0 0 1 0 18" stroke="#eef4d5" stroke-width="1.25" transform="translate(0 -4)"/><path d="m12 2-7 5.5 7 5.5" fill="#b7d090" stroke="#526d48" stroke-width="1.6"/><path d="M16 25c-3.5-1.2-5.5-.6-7 2.8 3.8 1.2 6.1.2 7-2.8Z" fill="#a6c180" stroke="#526d48" stroke-width="1.1"/></svg></span>
      <span class="tool-label">Geri al</span><small>Son hamle</small>

<script>
(()=>{
const U=1,R=2,D=4,L=8;
const DIRS=[{dx:0,dy:-1,b:U,o:D},{dx:1,dy:0,b:R,o:L},{dx:0,dy:1,b:D,o:U},{dx:-1,dy:0,b:L,o:R}];
const rotm=(m,n)=>{n=((n%4)+4)%4;for(let i=0;i<n;i++)m=((m<<1)|(m>>3))&15;return m};
const deg=m=>(m&1)+(m>>1&1)+(m>>2&1)+(m>>3&1);
function rng(seed){return()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);
  t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const store={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},
  set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};

const COLORS=[["#eeb397","#ab7059","#ffe5c9"],["#e6a9be","#a66d84","#ffe0e9"],["#edd181","#aa884b","#fff2bb"],
  ["#9dceb0","#618e75","#ddf1cb"],["#c2b0db","#8c77aa","#ece1f8"]];

/* ---------------- level generation ---------------- */
function config(n){
  if(n<=2) return {W:5,H:6,S:1};
  if(n<=5) return {W:5,H:7,S:2};
  if(n<=10) return {W:7,H:7,S:n<8?2:3};
  if(n<=18) return {W:7,H:8,S:3};
  return {W:7,H:9,S:4};
}
function generate(n){
  const {W,H,S}=config(n), r=rng(n*9973+17);
  const rc=W>>1, rr=Math.floor((H-1)/2);
  const idx=(x,y)=>y*W+x, inside=(x,y)=>x>=0&&y>=0&&x<W&&y<H;
  const blocked=(x,y)=>x===rc&&y<rr;
  const tree=new Array(W*H).fill(0), seen=new Array(W*H).fill(false), parent=new Array(W*H).fill(-1);
  const list=[[rc,rr]]; seen[idx(rc,rr)]=true;
  while(list.length){
    const i=r()<0.75?list.length-1:Math.floor(r()*list.length);
    const [x,y]=list[i];
    const opts=DIRS.filter(d=>{const nx=x+d.dx,ny=y+d.dy;return inside(nx,ny)&&!blocked(nx,ny)&&!seen[idx(nx,ny)]});
    if(!opts.length){list.splice(i,1);continue}
    const d=opts[Math.floor(r()*opts.length)], nx=x+d.dx, ny=y+d.dy;
    tree[idx(x,y)]|=d.b; tree[idx(nx,ny)]|=d.o; seen[idx(nx,ny)]=true; parent[idx(nx,ny)]=idx(x,y);
    list.push([nx,ny]);
  }
  const leaves=[];
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){
    if(blocked(x,y)||(x===rc&&y===rr))continue;
    if(deg(tree[idx(x,y)])===1)leaves.push([x,y]);
  }
  const corners=[[0,H-1],[W-1,H-1],[W-1,0],[0,0]];
  const cOrder=r()<.5?[0,1,2,3]:[1,0,3,2];
  const sources=[];
  for(let k=0;k<S;k++){
    const [cx,cy]=corners[cOrder[k]];
    let best=null,bd=1e9;
    for(const l of leaves){
      if(sources.some(s=>s[0]===l[0]&&s[1]===l[1]))continue;
      const dd=Math.abs(l[0]-cx)+Math.abs(l[1]-cy)+r()*.5;
      if(dd<bd){bd=dd;best=l}
    }
    if(best)sources.push(best);
  }
  const onPath=new Array(W*H).fill(false);
  for(const [x,y] of sources){let i=idx(x,y);while(i>=0){onPath[i]=true;i=parent[i]}}
  const tiles=[];
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){
    const i=idx(x,y);
    if(blocked(x,y)){tiles.push({kind:'block',x,y,base:U|D,rot:0});continue}
    let sol=0;
    if(onPath[i])for(const d of DIRS){const nx=x+d.dx,ny=y+d.dy;
      if(inside(nx,ny)&&onPath[idx(nx,ny)]&&(tree[i]&d.b))sol|=d.b}
    const col=COLORS[Math.floor(r()*COLORS.length)];
    if(x===rc&&y===rr){tiles.push({kind:'root',x,y,base:sol|U,rot:0,sol:sol|U});continue}
    if(sources.some(s=>s[0]===x&&s[1]===y)){tiles.push({kind:'src',x,y,base:sol,rot:0,sol,col});continue}
    if(onPath[i]){
      tiles.push({kind:'pipe',x,y,base:sol,rot:Math.floor(r()*4),sol,col});
    }else{
      const pool=[5,5,3,3,3,7,3,5];
      let b=r()<.07?0:pool[Math.floor(r()*pool.length)];
      if(b===0)tiles.push({kind:'empty',x,y,base:0,rot:0});
      else tiles.push({kind:'pipe',x,y,base:b,rot:Math.floor(r()*4),sol:null,col});
    }
  }
  const lv={n,W,H,rc,rr,tiles,sources};
  // make sure it doesn't start solved and most path tiles are off
  let guard=0;
  while(solved(lv)&&guard++<50){
    const p=tiles.filter(t=>t.kind==='pipe'&&t.sol!=null&&t.sol!==15);
    const t=p[Math.floor(r()*p.length)]; t.rot+=1;
  }
  lv.start=tiles.map(t=>t.rot);
  lv.par=tiles.reduce((a,t)=>{
    if(t.kind!=='pipe'||t.sol==null)return a;
    for(let k=0;k<4;k++)if(rotm(t.base,t.rot+k)===t.sol)return a+k;return a},0);
  return lv;
}
const cur=t=>rotm(t.base,t.rot);
function flood(lv,starts){
  const {W,H,tiles}=lv, got=new Set(starts), q=[...starts];
  while(q.length){
    const i=q.shift(), t=tiles[i], m=cur(t), x=i%W, y=(i/W)|0;
    for(const d of DIRS){
      if(!(m&d.b))continue;
      const nx=x+d.dx, ny=y+d.dy; if(nx<0||ny<0||nx>=W||ny>=H)continue;
      const j=ny*W+nx, u=tiles[j]; if(u.kind==='block'||got.has(j))continue;
      if(cur(u)&d.o){got.add(j);q.push(j)}
    }
  }
  return got;
}
function solved(lv){
  const g=flood(lv,[lv.rr*lv.W+lv.rc]);
  return lv.sources.every(([x,y])=>g.has(y*lv.W+x));
}

/* ---------------- drawing ---------------- */
const ARM={1:"M50 50L50 -2",2:"M50 50L102 50",4:"M50 50L50 102",8:"M50 50L-2 50"};
const ELB={3:"M50 -2L50 0A50 50 0 0 0 100 50L102 50",6:"M102 50L100 50A50 50 0 0 0 50 100L50 102",
  12:"M50 102L50 100A50 50 0 0 0 0 50L-2 50",9:"M-2 50L0 50A50 50 0 0 0 50 0L50 -2"};
function pathFor(m){
  if(ELB[m])return ELB[m];
  return [1,2,4,8].filter(b=>m&b).map(b=>ARM[b]).join("");
}
/* Glazed pastel conduits with a translucent water channel. */
let waterArtId=0;
const WATER_PORTS={1:[50,-2],2:[102,50],4:[50,102],8:[-2,50]};
const WATER_INNER={1:[50,26],2:[74,50],4:[50,74],8:[26,50]};
function waterRoute(from,to,curved=true){
  const a=WATER_PORTS[from],b=WATER_PORTS[to];
  if(!a||!b)return '';
  if(rotm(from,2)===to)return `M${a}L${b}`;
  return curved?`M${a}L${WATER_INNER[from]}Q50 50 ${WATER_INNER[to]}L${b}`:`M${a}L50 50L${b}`;
}
function softPipePath(m){
  const ends=[U,R,D,L].filter(b=>m&b);
  if(ends.length===2)return waterRoute(ends[0],ends[1]);
  return ends.map(b=>`M50 50L${WATER_PORTS[b]}`).join('');
}
function waterArtDefs(id,col){

function pipeFlowSVG(m,inlet,outlets=null){
  const ports=[U,R,D,L].filter(b=>(m&b)&&b!==inlet),targets=outlets===null?ports:outlets;
  const draw=(d,i)=>`<path class="stream-bubbles" d="${d}" fill="none" stroke="#eefff3" stroke-width="3.6" stroke-linecap="round" stroke-dasharray=".1 27.9" style="--stream-delay:${i*-.6}s"/><path class="stream-sparkles" d="${d}" fill="none" stroke="#ddfff5" stroke-width="1.4" stroke-linecap="round" stroke-dasharray=".1 39.9"/>`;

/* Give bubble motion the real source-to-root direction, independent of tile rotation. */
function updateWaterCurrents(lv,wet,els){
  const {W,H,tiles}=lv,dist=new Map(),sourceIds=new Set(lv.sources.map(([x,y])=>y*W+x));
  sourceIds.forEach(i=>dist.set(i,0));
  // flood() returns its Set in BFS order, so an earlier neighbour is upstream.
  for(const i of wet){
    if(sourceIds.has(i))continue;
    const t=tiles[i],x=i%W,y=(i/W)|0,m=cur(t);
    let inlet=0,best=Infinity;
    for(const d of DIRS){
      const nx=x+d.dx,ny=y+d.dy;
      if(!(m&d.b)||nx<0||nx>=W||ny<0||ny>=H)continue;
      const j=ny*W+nx;
      if(dist.has(j)&&(cur(tiles[j])&d.o)&&dist.get(j)<best){best=dist.get(j);inlet=d.b;}
    }
    if(!inlet)continue;
    dist.set(i,best+1);
  }
  for(const i of wet){
    const t=tiles[i];if(t.kind!=='pipe'||!dist.has(i))continue;
    const m=cur(t),x=i%W,y=(i/W)|0,inlets=[],outlets=[];
    for(const d of DIRS){
      if(!(m&d.b))continue;
      const nx=x+d.dx,ny=y+d.dy,j=ny*W+nx,local=rotm(d.b,-t.rot);
      const connected=nx>=0&&nx<W&&ny>=0&&ny<H&&dist.has(j)&&(cur(tiles[j])&d.o);
      if(connected&&dist.get(j)<dist.get(i))inlets.push(local);
      else if(!connected||dist.get(j)>dist.get(i))outlets.push(local);
    }
    const group=els[i].querySelector('.pipe-currents'),signature=inlets.join(',')+'>'+outlets.join(',');
    if(group&&group.dataset.flow!==signature){
      group.dataset.inlet=String(inlets[0]||0);group.dataset.flow=signature;
      group.innerHTML=inlets.map(inlet=>pipeFlowSVG(t.base,inlet,outlets)).join('');
    }
  }
}

let ac=null, soundOn=store.get("kvs-sound",true);
function tone(f,t=.08,type="sine",v=.08,delay=0){
  if(!soundOn)return;
  try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();
    const o=ac.createOscillator(),g=ac.createGain(),s=ac.currentTime+delay;
    o.type=type;o.frequency.setValueAtTime(f,s);g.gain.setValueAtTime(v,s);g.gain.exponentialRampToValueAtTime(.0001,s+t);
    o.connect(g).connect(ac.destination);o.start(s);o.stop(s+t+.02)}catch(e){}
}
const sClick=()=>tone(420+Math.random()*60,.06,"triangle",.06);

const $=s=>document.querySelector(s);

/* Quiet soil: fine grain, broad tonal depth, and a few small edge details. */
function soilArt(w,h,seed){
  const r=rng(seed*19+411),f=n=>n.toFixed(2),id='soil-'+seed;

  for(let i=0;i<28;i++){
    const x=r()*59,y=r()*61,rx=.25+r()*.42;
    grain+=`<ellipse cx="${f(x)}" cy="${f(y)}" rx="${f(rx)}" ry="${f(rx*(.55+r()*.4))}" fill="${i%3?'#d0aa7d':'#1d1815'}" opacity="${i%3?.10:.18}"/>`;
  }
  const pebbles=[[.075,.15,2.6],[.9,.22,2.1],[.13,.46,1.9],[.88,.59,2.9],[.075,.79,2.2],[.7,.87,1.7],[.91,.9,1.9]];
  let accents='';
  for(const [px,py,size] of pebbles){
    const x=px*w,y=py*h,rot=-20+r()*40;
    accents+=`<g transform="translate(${f(x)} ${f(y)}) rotate(${f(rot)})" opacity=".55"><path d="M${-size} 0Q${-size*.8} ${-size*.8} 0 ${-size*.67}Q${size*.7} ${-size*.78} ${size} 0Q${size*.8} ${size*.55} 0 ${size*.58}Q${-size*.9} ${size*.7} ${-size} 0Z" fill="#82664b"/><path d="M${-size*.65} ${-size*.22}Q0 ${-size*.75} ${size*.57} ${-size*.24}" fill="none" stroke="#b59670" stroke-width=".6" opacity=".62"/></g>`;
  }
  return `<defs>
    <linearGradient id="${id}-base" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#4b372a"/><stop offset=".45" stop-color="#413025"/><stop offset="1" stop-color="#34271f"/></linearGradient>
    <radialGradient id="${id}-light" cx=".48" cy=".12" r=".82"><stop stop-color="#b18250" stop-opacity=".075"/><stop offset="1" stop-color="#0f1110" stop-opacity=".09"/></radialGradient>
    <pattern id="${id}-grain" width="59" height="61" patternUnits="userSpaceOnUse">${grain}</pattern>
  </defs>
  <rect width="${w}" height="${h}" fill="url(#${id}-base)"/>
  <rect width="${w}" height="${h}" fill="url(#${id}-light)"/>
  <g fill="none" stroke-linecap="round">
    <path d="M-18 ${f(h*.27)}Q${f(w*.14)} ${f(h*.235)} ${f(w*.3)} ${f(h*.29)}T${f(w*.7)} ${f(h*.3)}" stroke="#d8ad78" stroke-width="1.1" opacity=".028"/>
    <path d="M${f(w*.61)} ${f(h*.62)}Q${f(w*.85)} ${f(h*.575)} ${w+15} ${f(h*.62)}" stroke="#c39764" stroke-width="1.2" opacity=".04"/>
    <path d="M-10 ${f(h*.83)}Q${f(w*.2)} ${f(h*.79)} ${f(w*.38)} ${f(h*.84)}" stroke="#181716" stroke-width="1.8" opacity=".07"/>
  </g>
  <rect width="${w}" height="${h}" fill="url(#${id}-grain)"/>

    <path d="M2 13q11 7 9 19t10 23m-9 -22l9 6m-6 4l-4 9" stroke-width=".9"/>
    <path d="M${w-2} ${f(h*.36)}q-14 8 -10 21t-10 16m10 -16l-9 4" stroke-width=".8"/>
    <path d="M5 ${f(h*.67)}q8 7 6 15l8 8m-8 -8l-6 4" stroke-width=".65"/>
  </g>${accents}`;
}
function soilRootBridge(w,top,cell,seed){

  const id='soil-neck-'+seed,half=cell*.13,x=w/2;
  return `<defs><linearGradient id="${id}" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#4c392d"/><stop offset=".17" stop-color="#9a7956"/><stop offset=".37" stop-color="#b4976d"/><stop offset=".65" stop-color="#8a684a"/><stop offset="1" stop-color="#4f3b2f"/></linearGradient></defs>
    <g class="root-bridge">

      <path d="M${x-half*.45} 0Q${x-half*.6} ${top*.5} ${x-half*.4} ${top+1}" fill="none" stroke="#d1b28a" stroke-width=".8" opacity=".42"/>

      <path class="rootcore" d="M${x} ${top+1}V0" fill="none" stroke="#6cdae0" stroke-width="${cell*.05}" stroke-linecap="round"/>

function stones(){
  const s=$('#stones'),w=area.clientWidth,h=area.clientHeight;
  const top=board.offsetTop,cell=parseFloat(board.style.getPropertyValue('--cell'))||0;
  s.setAttribute('viewBox',`0 0 ${w} ${h}`);

}
function placeTree(){
  const sky=$('#sky'),wrap=$('#treeWrap');
  const height=Math.max(80,Math.min(sky.clientHeight-49,sky.clientWidth*.76*216/240));
  wrap.style.width=(height*240/216).toFixed(2)+'px';
  wrap.style.height=height.toFixed(2)+'px';
  // The artwork's ground contact is y=201, rather than the SVG's bottom at 216.
  wrap.style.bottom=(-height*(216-201)/216).toFixed(2)+'px';
}


function layout(){
  const aw=area.clientWidth-20, ah=area.clientHeight-24;
  const c=Math.floor(Math.min(aw/lv.W, ah/lv.H, 78));
  board.style.setProperty("--cell",c+"px");
  board.style.setProperty("--w",lv.W);board.style.setProperty("--h",lv.H);
  $("#ground").style.setProperty("--root-neck-width",(c*.26+6).toFixed(2)+"px");
  stones(); placeTree(); placeSky();
}
function load(n){
  level=n; store.set("kvs-level",n);
  lv=generate(n); history=[]; moves=0; hints=3; busy=false; lastWet=new Set();
  $("#lvl").textContent="Seviye "+n;
  $("#goal").title=speciesFor(n).name;
  $("#treeWrap").innerHTML=treeSVG(n);
  $("#goal").textContent=lv.sources.length>1?`${lv.sources.length} kaynağı bağla`:"Kaynağı bağla";
  board.innerHTML=""; els=[];
  lv.tiles.forEach((t,i)=>{
    const el=document.createElement("div");
    el.className="tile "+t.kind+(t.kind==='block'&&t.y===0?' top-root':'');
    let inner="";
    if(t.kind==="pipe")inner=pipeSVG(t.base,t.col);
    else if(t.kind==="src")inner=srcSVG(t.base,t.col);
    else if(t.kind==="root")inner=rootSVG(t.base,t.y);
    else if(t.kind==="block")inner=blockSVG(t.y);
    el.innerHTML=`<div class="rot">${inner}</div>`;
    if(t.kind==="pipe"){
      el.setAttribute("role","button");el.tabIndex=0;el.setAttribute("aria-label","Boruyu çevir");
      el.addEventListener("pointerdown",e=>{e.preventDefault();turn(i,1,true)});
      el.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();turn(i,1,true)}});
    }
    board.appendChild(el); els.push(el);
  });
  layout(); paint(true); refresh();
}
function paint(instant){
  lv.tiles.forEach((t,i)=>{
    const r=els[i].firstChild;
    if(instant)r.style.transition="none";
    r.style.transform=`rotate(${t.rot*90}deg)`;
    if(instant){r.offsetWidth;r.style.transition=""}
  });
  // water: from sources
  const W=lv.W, wet=flood(lv,lv.sources.map(([x,y])=>y*W+x));
  let grew=false;
  els.forEach((el,i)=>{const w=wet.has(i);if(w&&!lastWet.has(i))grew=true;el.classList.toggle("wet",w)});
  if(grew&&!instant)sBlub();
  updateWaterCurrents(lv,wet,els);
  lastWet=wet;
}
function refresh(){
  $("#moves").textContent="Hamle: "+moves;
  $("#hintLeft").textContent=hints+" hak";
  $("#bHint").disabled=hints<=0||busy;
  $("#bUndo").disabled=!history.length||busy;
}
function turn(i,dir,record){
  if(busy)return;
  const t=lv.tiles[i]; t.rot+=dir;
  if(record){history.push(i);moves++;sClick()}
  paint(false); refresh();
  if(solved(lv))win();
}
$("#bUndo").onclick=()=>{if(busy||!history.length)return;const i=history.pop();lv.tiles[i].rot-=1;moves=Math.max(0,moves-1);sClick();paint(false);refresh()};
$("#bReset").onclick=()=>{if(busy)return;lv.tiles.forEach((t,i)=>t.rot=lv.start[i]);history=[];moves=0;paint(false);refresh()};
$("#bHint").onclick=()=>{
  if(busy||hints<=0)return;
  const wrong=lv.tiles.map((t,i)=>[t,i]).filter(([t])=>t.kind==="pipe"&&t.sol!=null&&cur(t)!==t.sol);
  if(!wrong.length)return;
  // prefer one touching the water
  wrong.sort((a,b)=>(lastWet.has(b[1])?1:0)-(lastWet.has(a[1])?1:0));
  const [t,i]=wrong[0];
  let k=1;while(rotm(t.base,t.rot+k)!==t.sol)k++;
  t.rot+=k; moves++; hints--;
  els[i].classList.remove("hint");void els[i].offsetWidth;els[i].classList.add("hint");
  tone(880,.2,"sine",.06);
  paint(false);refresh();
  if(solved(lv))win();
};

/* ---------------- win sequence ---------------- */
const wait=ms=>new Promise(r=>setTimeout(r,ms));
async function win(){
  busy=true; refresh();
  const W=lv.W, rootI=lv.rr*W+lv.rc;
  // 1) pulse from sources toward root by BFS distance
  const dist=new Map(), q=[];
  lv.sources.forEach(([x,y])=>{const i=y*W+x;dist.set(i,0);q.push(i)});
  const g=flood(lv,[rootI]);
  while(q.length){const i=q.shift(),x=i%W,y=(i/W)|0,m=cur(lv.tiles[i]);
    for(const d of DIRS){if(!(m&d.b))continue;const j=(y+d.dy)*W+(x+d.dx);
      if(g.has(j)&&!dist.has(j)&&y+d.dy>=0){dist.set(j,dist.get(i)+1);q.push(j)}}}
  let maxd=0;
  dist.forEach((d,i)=>{maxd=Math.max(maxd,d);setTimeout(()=>{els[i].classList.remove("pulse");void els[i].offsetWidth;els[i].classList.add("pulse")},d*70)});
  await wait(maxd*70+150);
  // 2) water climbs up the root column
  const col=[rootI];for(let y=lv.rr-1;y>=0;y--)col.push(y*W+lv.rc);
  for(const i of col){els[i].classList.add("flow","wet");tone(300+ (lv.rr-((i/W)|0))*60,.1,"sine",.05);await wait(160)}
  await wait(200);
  // 3) tree flies to center and blooms
  const app=$("#app").getBoundingClientRect();
  const src=$("#treeWrap").getBoundingClientRect();
  const winEl=$("#win");
  const fly=document.createElement("div");
  fly.className="fly";
  fly.innerHTML=$("#treeWrap").innerHTML;
  fly.style.left=(src.left-app.left)+"px";fly.style.top=(src.top-app.top)+"px";fly.style.width=src.width+"px";
  winEl.appendChild(fly);
  $("#treeWrap").style.visibility="hidden";
  winEl.classList.add("on");
  const targetW=Math.min(app.width*.76,360), scale=targetW/src.width;
  const tx=(app.width-targetW)/2-(src.left-app.left);
  const ty=app.height*.40-(src.height*scale)/2-(src.top-app.top);
  const anim=fly.animate([{transform:"translate(0,0) scale(1)"},{transform:`translate(${tx}px,${ty-30}px) scale(${scale*1.04})`,offset:.75},{transform:`translate(${tx}px,${ty}px) scale(${scale})`}],
    {duration:1000,easing:"cubic-bezier(.5,0,.2,1)",fill:"forwards"});
  await anim.finished.catch(()=>{});
  const t=fly.querySelector(".tree");
  t.classList.add("bloom"); sWin();
  sparkle(app, targetW);
  await wait(900);
  leafRain(winEl);
  // stars
  const s=moves<=lv.par+2?3:moves<=lv.par*1.6+5?2:1;
  document.querySelectorAll(".stars span").forEach((e,i)=>e.classList.toggle("on",i<s));
  $("#winTitle").textContent=speciesFor(level).name+" Yeşerdi!";
  $("#winSub").textContent=`${moves} hamlede · ${lv.sources.length} su kaynağı bağlandı`;
  await wait(500);
  winEl.classList.add("show");
  $("#bNext").focus({preventScroll:true});
}
function sparkle(app,w){
  const winEl=$("#win");
  for(let i=0;i<28;i++){
    const s=document.createElement("div");s.className="spark";
    s.style.left=app.width/2+"px";s.style.top=app.height*.36+"px";
    const a=Math.random()*Math.PI*2, d=w*.35+Math.random()*w*.35;
    s.style.setProperty("--dx",Math.cos(a)*d+"px");s.style.setProperty("--dy",Math.sin(a)*d+"px");
    s.style.animationDelay=Math.random()*.4+"s";
    winEl.appendChild(s);setTimeout(()=>s.remove(),1600);
  }
}
let rainT=null;
function leafRain(winEl){
  let n=0;
  rainT=setInterval(()=>{
    if(n++>40){clearInterval(rainT);return}
    const f=document.createElement("div");f.className="fall";
    f.style.left=Math.random()*100+"%";
    f.style.background=["#7cc26a","#9bd67a","#5fae57","#ffc2d1"][n%4];
    f.style.setProperty("--dx",(Math.random()-.5)*160+"px");f.style.setProperty("--r",(Math.random()*720-360)+"deg");
    f.style.animationDuration=3+Math.random()*3+"s";
    winEl.appendChild(f);setTimeout(()=>f.remove(),6500);
  },120);
}
$("#bNext").onclick=()=>{
  const winEl=$("#win");
  clearInterval(rainT);
  winEl.classList.remove("show","on");
  setTimeout(()=>{winEl.querySelectorAll(".fly,.fall,.spark").forEach(e=>e.remove());$("#treeWrap").style.visibility=""},700);
  load(level+1);
};

/* ---------------- menu ---------------- */
const menu=$("#menu");
$("#gear").onclick=e=>{e.stopPropagation();menu.hidden=!menu.hidden};
document.addEventListener("pointerdown",e=>{if(!menu.hidden&&!menu.contains(e.target)&&e.target.closest("#gear")==null)menu.hidden=true});
const soundLabel=()=>$("#mSound").textContent="Ses: "+(soundOn?"Açık":"Kapalı");
soundLabel();
$("#mSound").onclick=()=>{soundOn=!soundOn;store.set("kvs-sound",soundOn);soundLabel()};
$("#mPrev").onclick=()=>{if(busy)return;menu.hidden=true;if(level>1)load(level-1)};
$("#mNext").onclick=()=>{if(busy)return;menu.hidden=true;load(level+1)};

addEventListener("resize",()=>lv&&layout());
$("#skyScenery").innerHTML=skyScenery();
const syncSceneVisibility=()=>$("#app").classList.toggle("scene-paused",document.hidden);
document.addEventListener("visibilitychange",syncSceneVisibility);
syncSceneVisibility();
load(level);
if(document.fonts)document.fonts.ready.then(()=>lv&&layout());
})();
</script>
</body>
</html>
